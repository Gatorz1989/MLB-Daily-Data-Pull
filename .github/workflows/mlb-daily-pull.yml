name: MLB Daily Data Pull

on:
  schedule:
    # Runs at 11:00 AM ET (15:00 UTC) — after morning lines are set
    - cron: '0 15 * * *'
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit mlb_edge_data.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MLB data pull
        env:
          ODDS_API_KEY:    ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          ODDS_REGION:     us
          ODDS_BOOKS:      draftkings,fanduel,betmgm,bet365_us
        run: |
          python "mlb edge data pull.py" \
            --out mlb_edge_data.json \
            --verbose

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_edge_data.json
          # Only commit if the file actually changed
          git diff --staged --quiet || git commit -m "chore: MLB data pull $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
